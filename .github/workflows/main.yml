name: Build App Distribution

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON secret not set; using existing file if present"
          fi
      - name: Prepare firebase options
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS }}
        run: |
          mkdir -p lib
          backup_file=lib/firebase_options.dart
          if [ -f "$backup_file" ]; then
            cp "$backup_file" "$backup_file.bak"
          fi

          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
            echo "Wrote firebase_options.dart from secret"
          else
            echo "FIREBASE_OPTIONS secret not set; using repository version"
          fi

          if grep -q "class DefaultFirebaseOptions" lib/firebase_options.dart && grep -q "currentPlatform" lib/firebase_options.dart; then
            echo "firebase_options.dart looks valid"
          else
            if [ -f "$backup_file.bak" ]; then
              cp "$backup_file.bak" "$backup_file"
              echo "Secret content was invalid; restored repository firebase_options.dart"
            else
              echo "Secret content was invalid and no backup was available" >&2
              exit 1
            fi
          fi

          test -f lib/firebase_options.dart && echo "firebase_options.dart exists" || { echo "firebase_options.dart missing"; exit 1; }
          rm -f "$backup_file.bak"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: upload artifact to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{secrets.APPID}}
          token: ${{secrets.TOKEN}}
          groups: app_QA_team
          file: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Prepare firebase options
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS }}
        run: |
          mkdir -p lib
          backup_file=lib/firebase_options.dart
          if [ -f "$backup_file" ]; then
            cp "$backup_file" "$backup_file.bak"
          fi

          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
            echo "Wrote firebase_options.dart from secret"
          else
            echo "FIREBASE_OPTIONS secret not set; using repository version"
          fi

          if grep -q "class DefaultFirebaseOptions" lib/firebase_options.dart && grep -q "currentPlatform" lib/firebase_options.dart; then
            echo "firebase_options.dart looks valid"
          else
            if [ -f "$backup_file.bak" ]; then
              cp "$backup_file.bak" "$backup_file"
              echo "Secret content was invalid; restored repository firebase_options.dart"
            else
              echo "Secret content was invalid and no backup was available" >&2
              exit 1
            fi
          fi

          test -f lib/firebase_options.dart && echo "firebase_options.dart exists" || { echo "firebase_options.dart missing"; exit 1; }
          rm -f "$backup_file.bak"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - run: flutter pub get
      - run: flutter precache --ios
      - run: flutter build ios --release --no-codesign
      - name: Create iOS archive
        run: |
          mkdir -p build/ios-artifacts
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios-artifacts/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO
      - name: Export iOS IPA
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>compileBitcode</key>
            <false/>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/ios-artifacts/Runner.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ios-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios-artifacts/*.ipa
      - name: upload iOS artifact to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.APPID }}
          FIREBASE_GROUPS: app_QA_team
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute build/ios-artifacts/*.ipa \
            --app "$FIREBASE_APP_ID" \
            --token "$FIREBASE_TOKEN" \
            --groups "$FIREBASE_GROUPS"
